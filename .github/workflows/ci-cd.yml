name: CI/CD Pipeline

on:
  # Temporarily disabled automatic runs.
  # Use manual dispatch from GitHub Actions tab when needed.
  workflow_dispatch:

jobs:
  # Frontend: Lint and Build
  frontend-ci:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: moonshot-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./moonshot-app

      - name: Run ESLint
        run: npm run lint
        working-directory: ./moonshot-app

      - name: Build Next.js app
        run: npm run build
        working-directory: ./moonshot-app

  # Backend: Build and Test
  backend-ci:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore moonshot-backend/MoodRadar.sln

      - name: Build solution
        run: dotnet build moonshot-backend/MoodRadar.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test moonshot-backend/MoodRadar.sln --configuration Release --no-build --verbosity normal
        continue-on-error: true

  # Optional: Code quality checks (add as needed)
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    if: always()

    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.frontend-ci.result }}" = "failure" ] || [ "${{ needs.backend-ci.result }}" = "failure" ]; then
            echo "❌ CI Pipeline failed"
            exit 1
          else
            echo "✅ All checks passed"
          fi
